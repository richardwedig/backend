<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work Tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱️</text></svg>">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to main content</a>

  <div id="login" class="login" hidden>
    <form class="login-box">
      <h1>⏱️ Work Tracker</h1>
      <label for="login-pw">Please type your password</label>
      <input id="login-pw" type="password" autocomplete="current-password">
      <p class="modal-error" role="alert" hidden></p>
      <button class="btn btn-primary btn-big" type="submit">Sign in</button>
    </form>
  </div>

  <div id="app" class="layout">
    <aside class="sidebar" aria-label="Main menu">
      <a class="brand" href="#/"><span aria-hidden="true">⏱️</span> Work Tracker</a>
      <button class="btn btn-light menu-toggle" aria-expanded="false" aria-controls="nav">☰ Menu</button>
      <nav id="nav">
        <a href="#/" data-nav="home"><span aria-hidden="true">🏠</span> Home</a>
        <a href="#/hours" data-nav="hours"><span aria-hidden="true">⏱️</span> My Hours</a>
        <a href="#/projects" data-nav="projects"><span aria-hidden="true">📁</span> Projects</a>
        <a href="#/calendar" data-nav="calendar"><span aria-hidden="true">📅</span> Calendar</a>
        <a href="#/files" data-nav="files"><span aria-hidden="true">🗂️</span> Files &amp; Folders</a>
        <a href="#/reports" data-nav="reports"><span aria-hidden="true">📊</span> Reports</a>
        <a href="#/trash" data-nav="trash"><span aria-hidden="true">♻️</span> Recycle Bin <span class="badge" id="trash-badge" hidden></span></a>
        <a href="#/help" data-nav="help"><span aria-hidden="true">❓</span> Help</a>
      </nav>
      <div class="text-size" role="group" aria-label="Text size">
        <span>Text size:</span>
        <button class="btn btn-light" data-size="1" aria-label="Normal text">A</button>
        <button class="btn btn-light" data-size="1.15" aria-label="Larger text" style="font-size:1.15em">A</button>
        <button class="btn btn-light" data-size="1.3" aria-label="Largest text" style="font-size:1.3em">A</button>
      </div>
      <button class="btn btn-light signout" id="signout" hidden>Sign out</button>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <form class="search" role="search" id="search-form">
          <label for="search-box" class="sr-only">Search</label>
          <input id="search-box" type="search" placeholder="🔎 Search projects, files, folders…">
        </form>
        <div id="timer-chip"></div>
        <button class="btn btn-helper" id="open-helper" aria-controls="helper" aria-expanded="false">💬 Ask the Helper</button>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>

    <aside class="helper" id="helper" aria-label="Helper chat" hidden>
      <div class="helper-head">
        <h2>💬 Your Helper</h2>
        <button class="btn btn-light" id="helper-new" title="Start a fresh conversation">New chat</button>
        <button class="btn btn-light" id="helper-close" aria-label="Close the helper">✕ Close</button>
      </div>
      <div class="helper-messages" id="helper-messages" aria-live="polite"></div>
      <div class="helper-attachments" id="helper-attachments"></div>
      <form class="helper-form" id="helper-form">
        <label for="helper-input" class="sr-only">Type your question</label>
        <textarea id="helper-input" rows="3" placeholder="Type your question here, then press Send…"></textarea>
        <div class="helper-buttons">
          <button type="button" class="btn btn-light" id="helper-attach" title="Attach a Word document, spreadsheet or other file">📎 Attach a file</button>
          <button type="submit" class="btn btn-primary" id="helper-send">Send ➤</button>
        </div>
      </form>
    </aside>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
