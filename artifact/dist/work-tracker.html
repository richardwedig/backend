<title>Work Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: fixed menu on the left, work area in the middle, helper chat on the right.
   Built for easy reading: Atkinson Hyperlegible, large sizes, strong contrast, big targets. */
:root {
  --scale: 1;
  --font: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  --bg: #eef1f5;
  --surface: #ffffff;
  --surface-2: #f6f8fb;
  --ink: #12161c;
  --ink-2: #3c4552;
  --muted: #5f6a78;
  --line: #d3dae3;
  --field-line: #98a3b1;
  --field-bg: #ffffff;
  --primary: #1f5fae;
  --primary-hover: #174b8c;
  --primary-ink: #ffffff;
  --primary-soft: #e3ecf8;
  --good: #1d7a3a;
  --good-hover: #155c2b;
  --good-soft: #e3f3e8;
  --good-line: #9fd3b0;
  --danger: #b3261e;
  --danger-hover: #8c1d17;
  --danger-soft: #fbe9e7;
  --danger-line: #f0b8b3;
  --warn-soft: #fff5d6;
  --warn-line: #e6c55c;
  --helper-bg: #fff1c2;
  --helper-line: #d9a900;
  --on-strong: #ffffff;
  --toast-bg: #12161c;
  --toast-ink: #ffffff;
  --grid: #e3e8ee;
  --sheet-focus: #fffbea;
  --scrim: rgba(18, 22, 28, .5);
  --focus: #f0a400;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 4px 14px rgba(16, 24, 40, .06);
  --bar: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151b; --surface: #1a2028; --surface-2: #202833; --ink: #f1f4f8; --ink-2: #c9d1db; --muted: #9aa6b4;
    --line: #313b48; --field-line: #5c6878; --field-bg: #141a21; --primary: #5b9be8; --primary-hover: #7fb2ee; --primary-ink: #0b1420;
    --primary-soft: #1c2c42; --good: #5cc27e; --good-hover: #7ad296; --good-soft: #17301f; --good-line: #2f6b42; --danger: #f07a72;
    --danger-hover: #f4978f; --danger-soft: #3a1c1a; --danger-line: #6e2e29; --warn-soft: #33290f; --warn-line: #7a6320;
    --helper-bg: #3a3010; --helper-line: #b38c1a; --on-strong: #0b1420; --toast-bg: #f1f4f8; --toast-ink: #11151b;
    --grid: #2a333f; --sheet-focus: #2a2614; --scrim: rgba(0, 0, 0, .6); --bar: #3987e5;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151b; --surface: #1a2028; --surface-2: #202833; --ink: #f1f4f8; --ink-2: #c9d1db; --muted: #9aa6b4;
  --line: #313b48; --field-line: #5c6878; --field-bg: #141a21; --primary: #5b9be8; --primary-hover: #7fb2ee; --primary-ink: #0b1420;
  --primary-soft: #1c2c42; --good: #5cc27e; --good-hover: #7ad296; --good-soft: #17301f; --good-line: #2f6b42; --danger: #f07a72;
  --danger-hover: #f4978f; --danger-soft: #3a1c1a; --danger-line: #6e2e29; --warn-soft: #33290f; --warn-line: #7a6320;
  --helper-bg: #3a3010; --helper-line: #b38c1a; --on-strong: #0b1420; --toast-bg: #f1f4f8; --toast-ink: #11151b;
  --grid: #2a333f; --sheet-focus: #2a2614; --scrim: rgba(0, 0, 0, .6); --bar: #3987e5;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { font-size: calc(19px * var(--scale)); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font); line-height: 1.5;
}
h1, h2, h3 { text-wrap: balance; }
h1 { font-size: 1.9rem; margin: 0 0 .25rem; line-height: 1.2; }
h2 { font-size: 1.35rem; margin: 0 0 .75rem; }
h3 { font-size: 1.1rem; margin: 0 0 .5rem; }
p { margin: 0 0 .75rem; }
a { color: var(--primary); }
.big { font-size: 1.1rem; }
.muted { color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -999px; top: 0; background: var(--toast-bg); color: var(--toast-ink); padding: .5rem 1rem; z-index: 100; }
.skip:focus { left: 0; }
:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- layout */
.layout { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; background: linear-gradient(to right, var(--surface) 259px, var(--line) 259px, var(--line) 260px, var(--bg) 260px); }
.layout.helper-open { grid-template-columns: 260px 1fr 420px; }
.sidebar { background: var(--surface); padding: 1rem .75rem; display: flex; flex-direction: column; gap: .75rem; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { font-size: 1.35rem; font-weight: 800; text-decoration: none; color: var(--ink); padding: .25rem .5rem .75rem; }
#nav { display: flex; flex-direction: column; gap: .3rem; }
#nav a { display: flex; align-items: center; gap: .7rem; padding: .8rem .9rem; border-radius: 12px; text-decoration: none; color: var(--ink); font-size: 1.08rem; font-weight: 600; border: 2px solid transparent; }
#nav a span:first-child { font-size: 1.3rem; width: 1.6rem; text-align: center; }
#nav a:hover { background: var(--primary-soft); }
#nav a.active { background: var(--primary); color: var(--primary-ink); }
.badge { margin-left: auto; background: var(--danger); color: var(--on-strong); border-radius: 99px; font-size: .8rem; padding: 0 .55rem; }
#nav a.active .badge { background: var(--primary-ink); color: var(--primary); }
.sidebar .menu-toggle { display: none; }
.text-size { margin-top: auto; display: flex; align-items: center; gap: .3rem; flex-wrap: wrap; font-size: .9rem; color: var(--muted); }
.text-size > span { width: 100%; }
.text-size .btn { padding: .3rem .7rem; min-height: 2.4rem; }
.text-size .btn.on { background: var(--primary-soft); border-color: var(--primary); }
.main-wrap { min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; gap: .75rem; align-items: center; padding: .9rem 1.5rem; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
.search { flex: 1; min-width: 200px; }
.search input { width: 100%; }
main { padding: 1.5rem; max-width: 1200px; width: 100%; }
main:focus, main:focus-visible { outline: none; }

/* ---------- controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .45rem; font: inherit; font-weight: 650; font-size: 1rem; min-height: 3rem; padding: .55rem 1.1rem; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; line-height: 1.2; }
.btn:hover { border-color: var(--ink-2); }
.btn-primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn-good { background: var(--good); border-color: var(--good); color: var(--on-strong); }
.btn-good:hover { background: var(--good-hover); border-color: var(--good-hover); }
.btn-danger { background: var(--danger); border-color: var(--danger); color: var(--on-strong); }
.btn-danger:hover { background: var(--danger-hover); border-color: var(--danger-hover); }
.btn-light { background: var(--surface); }
.btn-quiet { border-color: transparent; background: transparent; color: var(--primary); text-decoration: underline; min-height: 2.6rem; padding: .3rem .5rem; }
.btn-big { font-size: 1.2rem; min-height: 3.8rem; padding: .8rem 1.6rem; }
.btn-helper { background: var(--helper-bg); border-color: var(--helper-line); font-size: 1.05rem; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-row { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
input, select, textarea { font: inherit; font-size: 1.05rem; padding: .65rem .8rem; border: 2px solid var(--field-line); border-radius: 10px; background: var(--field-bg); color: var(--ink); min-height: 3rem; max-width: 100%; }
input:focus, select:focus, textarea:focus { border-color: var(--primary); }
textarea { width: 100%; resize: vertical; }
.field { display: flex; flex-direction: column; gap: .3rem; margin-bottom: 1rem; }
.field label { font-weight: 700; }
.field .hint { color: var(--muted); font-size: .9rem; }
.field input, .field select { width: 100%; }
.inline-row { display: flex; gap: .5rem; flex-wrap: wrap; }
.inline-row input { flex: 1; min-width: 160px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0 1rem; }
.chips { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: .3rem; }
.chip { font: inherit; font-size: .95rem; padding: .35rem .8rem; border-radius: 99px; border: 2px solid var(--line); background: var(--surface-2); cursor: pointer; min-height: 2.4rem; }
.chip:hover, .chip.on { border-color: var(--primary); background: var(--primary-soft); }

/* ---------- cards & lists */
.page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
.page-head p { color: var(--ink-2); margin: .2rem 0 0; font-size: 1.05rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.25rem; box-shadow: var(--shadow); margin-bottom: 1.25rem; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: .75rem; flex-wrap: wrap; margin-bottom: .75rem; }
.card-head h2 { margin: 0; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 0 1.25rem; align-items: start; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.25rem; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem 1.2rem; box-shadow: var(--shadow); }
.stat .label { color: var(--ink-2); font-weight: 600; }
.stat .value { font-size: 2.2rem; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; }
.stat .unit { font-size: 1rem; font-weight: 600; color: var(--muted); }
.quick { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: .75rem; margin-bottom: 1.25rem; }
.quick .btn { min-height: 4.2rem; font-size: 1.1rem; justify-content: flex-start; padding: .8rem 1.1rem; }
.quick .btn span { font-size: 1.6rem; }
.list { list-style: none; margin: 0; padding: 0; }
.list > li { display: flex; align-items: center; gap: .9rem; padding: .8rem .2rem; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.list > li:last-child { border-bottom: 0; }
.list .grow { flex: 1; min-width: 180px; }
.list .title { font-weight: 700; font-size: 1.05rem; }
.list .sub { color: var(--ink-2); font-size: .95rem; }
.list .icon { font-size: 1.6rem; width: 2rem; text-align: center; }
.list a.title { text-decoration: none; color: var(--ink); }
.list a.title:hover { text-decoration: underline; color: var(--primary); }
.dot { display: inline-block; width: .9rem; height: .9rem; border-radius: 50%; flex: none; }
.amount { font-weight: 800; font-size: 1.15rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.empty { text-align: center; padding: 1.5rem 1rem; color: var(--ink-2); }
.empty-icon { font-size: 2.6rem; }
.date-head { margin: 1rem 0 .2rem; font-size: 1.05rem; color: var(--ink-2); border-bottom: 2px solid var(--line); padding-bottom: .25rem; display: flex; justify-content: space-between; }
.notice { background: var(--warn-soft); border: 1px solid var(--warn-line); border-radius: 12px; padding: .9rem 1.1rem; margin-bottom: 1rem; }
.notice-good { background: var(--good-soft); border-color: var(--good-line); }

/* projects */
.project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
.project-card { display: block; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-left: 10px solid var(--c); border-radius: var(--radius); padding: 1.1rem 1.2rem; box-shadow: var(--shadow); }
.project-card:hover { border-color: var(--ink-2); border-left-color: var(--c); }
.project-card h3 { font-size: 1.25rem; margin-bottom: .3rem; }
.project-card .done-tag, .tag { display: inline-block; font-size: .85rem; font-weight: 700; background: var(--good-soft); color: var(--good); border-radius: 99px; padding: .05rem .6rem; }
.color-choices { display: flex; gap: .5rem; flex-wrap: wrap; }
.color-choices label { display: inline-flex; }
.color-choices input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.color-choices span { width: 2.6rem; height: 2.6rem; border-radius: 50%; border: 4px solid var(--surface); box-shadow: 0 0 0 2px var(--line); cursor: pointer; }
.color-choices input:checked + span { box-shadow: 0 0 0 4px var(--ink); }
.color-choices input:focus-visible + span { outline: 4px solid var(--focus); }

/* stopwatch */
.stopwatch { display: flex; align-items: center; gap: 1.25rem; flex-wrap: wrap; }
.stopwatch .clock { font-size: 3rem; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.stopwatch.running { background: var(--good-soft); border-color: var(--good-line); }
.timer-chip { display: inline-flex; align-items: center; gap: .5rem; background: var(--good-soft); border: 2px solid var(--good-line); color: var(--good); padding: .4rem .9rem; border-radius: 99px; font-weight: 700; text-decoration: none; }
.pulse { width: .8rem; height: .8rem; border-radius: 50%; background: var(--good); animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } * { scroll-behavior: auto !important; } }

/* charts */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--ink-2); font-size: 15px; font-family: inherit; }
.chart .grid { stroke: var(--grid); }
.chart .bar { fill: var(--bar); }
.chart .bar-hit:hover + .bar, .chart .bar:hover { opacity: .8; }
.hbar { display: grid; grid-template-columns: minmax(110px, 34%) 1fr auto; gap: .6rem; align-items: center; margin-bottom: .55rem; }
.hbar .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .track { height: 1.3rem; }
.hbar .fill { height: 100%; border-radius: 0 4px 4px 0; min-width: 3px; }
.hbar .val { font-weight: 700; font-variant-numeric: tabular-nums; }
.tooltip { position: fixed; pointer-events: none; background: var(--toast-bg); color: var(--toast-ink); padding: .35rem .6rem; border-radius: 8px; font-size: .9rem; z-index: 50; }

/* calendar */
.cal-head { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; margin-bottom: 1rem; }
.cal-head h2 { margin: 0 .5rem; min-width: 12ch; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .dow { font-weight: 700; text-align: center; color: var(--ink-2); padding: .3rem 0; }
.cal .day { background: var(--surface); border: 2px solid var(--line); border-radius: 10px; min-height: 7rem; padding: .35rem .45rem; text-align: left; font: inherit; cursor: pointer; display: flex; flex-direction: column; gap: .2rem; overflow: hidden; }
.cal .day:hover { border-color: var(--primary); }
.cal .day.other { background: transparent; opacity: .55; }
.cal .day.today { border-color: var(--primary); box-shadow: inset 0 0 0 2px var(--primary); }
.cal .day.selected { background: var(--primary-soft); }
.cal .num { font-weight: 800; font-size: 1.05rem; }
.cal .today .num { color: var(--primary); }
.cal .hrs { font-size: .85rem; font-weight: 700; color: var(--good); display: flex; align-items: center; gap: .3rem; }
.cal .ev { font-size: .85rem; background: var(--helper-bg); color: var(--ink); border-radius: 6px; padding: 0 .3rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal .more { font-size: .8rem; color: var(--muted); }

/* files */
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem; font-size: 1.05rem; margin-bottom: .75rem; }
.crumbs a { font-weight: 600; }
.folder-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: .75rem; margin-bottom: 1rem; }
.folder-tile { display: flex; align-items: center; gap: .7rem; padding: .9rem 1rem; border: 2px solid var(--line); border-radius: 12px; background: var(--surface-2); text-decoration: none; color: var(--ink); font-weight: 700; }
.folder-tile:hover { border-color: var(--primary); background: var(--primary-soft); }
.folder-tile .ico { font-size: 2rem; }
.folder-tile small { display: block; font-weight: 500; color: var(--muted); }
.dropzone { border: 3px dashed var(--field-line); border-radius: var(--radius); padding: 1.25rem; text-align: center; color: var(--ink-2); background: var(--surface-2); }
.dropzone.over { border-color: var(--primary); background: var(--primary-soft); }
.tree, .tree ul { list-style: none; margin: 0; padding: 0; }
.tree { max-height: 45vh; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; padding: .3rem; margin-bottom: .75rem; }
.tree-item { display: block; width: 100%; text-align: left; font: inherit; font-size: 1.02rem; background: none; border: 2px solid transparent; border-radius: 8px; padding: .5rem .6rem; cursor: pointer; color: var(--ink); }
.tree-item:hover { background: var(--primary-soft); }
.tree-item.selected { background: var(--primary); color: var(--primary-ink); font-weight: 700; }
.preview { border: 1px solid var(--line); border-radius: 10px; padding: 1.25rem; background: var(--surface); overflow: auto; max-height: 75vh; }
.preview img { max-width: 100%; }
.preview iframe { width: 100%; height: 70vh; border: 0; }
.preview table, .data-table { border-collapse: collapse; width: 100%; }
.preview td, .preview th, .data-table td, .data-table th { border: 1px solid var(--line); padding: .35rem .55rem; text-align: left; }
.data-table th { background: var(--primary-soft); }

/* spreadsheet editor */
.sheet-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 10px; max-height: 70vh; background: var(--surface); }
.sheet { border-collapse: separate; border-spacing: 0; min-width: 100%; }
.sheet th, .sheet td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 0; }
.sheet thead th { position: sticky; top: 0; background: var(--primary-soft); z-index: 1; }
.sheet input { border: 0; border-radius: 0; width: 100%; min-width: 9rem; min-height: 2.8rem; background: transparent; padding: .4rem .6rem; }
.sheet thead input { font-weight: 800; }
.sheet input:focus { outline: 3px solid var(--focus); outline-offset: -3px; background: var(--sheet-focus); }
.sheet .rownum { color: var(--muted); text-align: center; min-width: 2.6rem; font-size: .9rem; background: var(--surface-2); }
.sheet .rowdel, .sheet .coldel { border: 0; background: none; font-size: 1rem; cursor: pointer; color: var(--danger); padding: .4rem .6rem; min-height: 2.4rem; }
.sheet tfoot td { background: var(--surface-2); font-weight: 800; padding: .5rem .6rem; position: sticky; bottom: 0; }
.save-state { color: var(--muted); font-weight: 600; }
.save-state.ok { color: var(--good); }

/* modal */
.modal-back { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: 1rem; z-index: 40; }
.modal { background: var(--surface); border-radius: 18px; width: min(560px, 100%); max-height: 92vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.modal-wide { width: min(760px, 100%); }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 1.1rem 1.4rem .4rem; }
.modal-head h2 { margin: 0; }
.modal-x { font-size: 1.3rem; border: 0; background: none; cursor: pointer; padding: .4rem .6rem; border-radius: 8px; }
.modal-body { padding: .6rem 1.4rem; overflow-y: auto; }
.modal-error { background: var(--danger-soft); color: var(--danger); font-weight: 700; margin: 0 1.4rem; padding: .6rem .9rem; border-radius: 10px; }
.modal-buttons { display: flex; justify-content: flex-end; gap: .6rem; padding: 1rem 1.4rem 1.3rem; flex-wrap: wrap; }

/* toasts */
.toasts { position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: .5rem; z-index: 60; width: min(640px, calc(100% - 2rem)); }
.toast { display: flex; align-items: center; gap: .75rem; background: var(--toast-bg); color: var(--toast-ink); padding: .8rem 1rem; border-radius: 14px; font-size: 1.05rem; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.toast span { flex: 1; }
.toast-error { background: var(--danger); }
.toast-undo { min-height: 2.6rem; }
.toast-close { background: none; border: 0; color: var(--toast-ink); font-size: 1.1rem; cursor: pointer; padding: .3rem .5rem; }

/* helper chat */
.helper { background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
.helper-head { display: flex; align-items: center; gap: .5rem; padding: .9rem 1rem; border-bottom: 1px solid var(--line); }
.helper-head h2 { margin: 0; flex: 1; font-size: 1.2rem; }
.helper-head .btn { min-height: 2.6rem; padding: .3rem .7rem; font-size: .95rem; }
.helper-messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: .75rem; }
.msg { padding: .75rem 1rem; border-radius: 14px; max-width: 92%; white-space: normal; word-wrap: break-word; }
.msg p:last-child, .msg ul:last-child, .msg ol:last-child { margin-bottom: 0; }
.msg ul, .msg ol { margin: .3rem 0 .6rem; padding-left: 1.4rem; }
.msg-user { background: var(--primary); color: var(--primary-ink); align-self: flex-end; white-space: pre-wrap; }
.msg-assistant { background: var(--surface-2); border: 1px solid var(--line); align-self: flex-start; }
.msg-error { background: var(--danger-soft); border-color: var(--danger-line); }
.msg .go { display: inline-block; margin-top: .3rem; }
.typing { color: var(--muted); font-style: italic; }
.helper-suggest { display: flex; flex-direction: column; gap: .4rem; }
.helper-suggest .chip { text-align: left; border-radius: 12px; }
.helper-attachments { display: flex; flex-wrap: wrap; gap: .4rem; padding: 0 1rem; }
.helper-attachments .chip { cursor: default; }
.helper-form { padding: .8rem 1rem 1rem; border-top: 1px solid var(--line); }
.helper-buttons { display: flex; justify-content: space-between; gap: .5rem; margin-top: .5rem; flex-wrap: wrap; }

/* login */
.login { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 80; padding: 1rem; }
.login-box { background: var(--surface); padding: 2rem; border-radius: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: .8rem; width: min(420px, 100%); }
.login-box .modal-error { margin: 0; }

/* help */
.help-list details { border: 1px solid var(--line); border-radius: 12px; padding: .2rem 1rem; margin-bottom: .6rem; background: var(--surface); }
.help-list summary { font-weight: 700; font-size: 1.1rem; cursor: pointer; padding: .7rem 0; }
.help-list ol, .help-list ul { padding-left: 1.4rem; }
.help-list li { margin-bottom: .35rem; }

/* ---------- smaller screens */
@media (max-width: 1250px) {
  .layout.helper-open { grid-template-columns: 260px 1fr; }
  .helper { position: fixed; right: 0; top: 0; width: min(440px, 100%); z-index: 30; box-shadow: -10px 0 30px rgba(0,0,0,.15); }
}
@media (max-width: 860px) {
  html { font-size: calc(18px * var(--scale)); }
  .layout, .layout.helper-open { grid-template-columns: 1fr; background: var(--bg); }
  .sidebar { border-bottom: 1px solid var(--line); }
  .sidebar { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: .6rem 1rem; }
  .brand { padding: .2rem 0; }
  .sidebar .menu-toggle { display: inline-flex; }
  #nav { display: none; width: 100%; }
  .sidebar.open #nav { display: flex; }
  .text-size, .signout { display: none; }
  .sidebar.open .text-size, .sidebar.open .signout { display: flex; }
  .topbar { position: static; padding: .75rem 1rem; }
  main { padding: 1rem; }
  .cal .day { min-height: 4.6rem; padding: .2rem .25rem; }
  .cal .ev { display: none; }
  .cal .hrs .dot { display: none; }
  .grid-2 { grid-template-columns: 1fr; }
  .stat .value { font-size: 1.8rem; }
}
@media print {
  .sidebar, .topbar, .helper, .toasts, .btn { display: none !important; }
  .layout { display: block; }
}
